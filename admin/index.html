<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Back-office — Irene</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

  <!-- ===== Connexion ===== -->
  <main class="carte carte-admin" id="ecranConnexion">
    <div class="illustration">
      <span class="emoji emoji-cadenas">🔐</span>
    </div>

    <h1 class="question">Back-office</h1>
    <p class="sous-titre">Connecte-toi pour voir les réponses</p>

    <form class="champs" id="formConnexion">
      <label class="champ" for="email">
        <span class="champ-titre">Adresse e-mail</span>
        <input class="saisie" type="email" id="email" autocomplete="username"
               placeholder="ton@email.com" required>
      </label>

      <label class="champ" for="motdepasse">
        <span class="champ-titre">Mot de passe</span>
        <input class="saisie" type="password" id="motdepasse" autocomplete="current-password"
               placeholder="••••••••" required>
      </label>

      <p class="erreur" id="erreur"></p>

      <div class="boutons">
        <button type="submit" class="btn btn-oui" id="btnConnexion">Se connecter</button>
      </div>
    </form>
  </main>

  <!-- ===== Tableau de bord ===== -->
  <main class="carte carte-admin carte-large cachee" id="ecranTableau">

    <header class="entete-admin">
      <div>
        <h1 class="titre-admin">Les réponses d'Irène</h1>
        <p class="sous-titre-admin" id="compteur">—</p>
      </div>
      <div class="actions-admin">
        <button type="button" class="btn-mini" id="btnRafraichir">↻ Rafraîchir</button>
        <button type="button" class="btn-mini btn-mini-sortie" id="btnDeconnexion">Se déconnecter</button>
      </div>
    </header>

    <div class="stats" id="stats"></div>

    <div class="liste" id="liste"></div>

  </main>

  <script src="../config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
