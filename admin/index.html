<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Back-office — Irene</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

  <!-- ===================== CONNEXION (centrée) ===================== -->
  <div class="ecran-connexion" id="ecranConnexion">
    <main class="carte carte-connexion">

      <div class="illustration">
        <span class="emoji emoji-cadenas">🔐</span>
      </div>

      <h1 class="question">Back-office</h1>
      <p class="sous-titre">Connecte-toi pour voir ses réponses</p>

      <form class="champs" id="formConnexion">
        <label class="champ" for="email">
          <span class="champ-titre">Adresse e-mail</span>
          <input class="saisie" type="email" id="email" autocomplete="username"
                 placeholder="ton@email.com" required>
        </label>

        <label class="champ" for="motdepasse">
          <span class="champ-titre">Mot de passe</span>
          <input class="saisie" type="password" id="motdepasse" autocomplete="current-password"
                 placeholder="••••••••" required>
        </label>

        <p class="erreur" id="erreur"></p>

        <div class="boutons">
          <button type="submit" class="btn btn-oui" id="btnConnexion">Se connecter</button>
        </div>
      </form>

    </main>
  </div>

  <!-- ===================== DASHBOARD ===================== -->
  <div class="tableau-bord cachee" id="ecranTableau">

    <header class="barre">
      <div class="marque">
        <span class="marque-icone">💌</span>
        <span class="marque-texte">Irene<span class="marque-fin"> — back-office</span></span>
      </div>

      <div class="barre-actions">
        <span class="compte" id="compteConnecte"></span>
        <button type="button" class="btn-mini" id="btnRafraichir">↻ Rafraîchir</button>
        <button type="button" class="btn-mini btn-mini-sortie" id="btnDeconnexion">Déconnexion</button>
      </div>
    </header>

    <main class="contenu">

      <div class="accueil">
        <h1 class="titre-tableau">Les réponses d'Irène</h1>
        <p class="sous-titre-tableau" id="compteur">—</p>
      </div>

      <section class="stats" id="stats"></section>

      <section class="panneau">
        <div class="panneau-entete">
          <h2 class="panneau-titre">Détail des parties</h2>
          <span class="pastille" id="pastilleTotal">0</span>
        </div>

        <div class="tableau-conteneur">
          <table class="tableau">
            <thead>
              <tr>
                <th>Quand</th>
                <th>Jour choisi</th>
                <th>Heure</th>
                <th>Ambiance</th>
                <th>Tentatives « Non »</th>
                <th>Appareil</th>
              </tr>
            </thead>
            <tbody id="lignes"></tbody>
          </table>
        </div>

        <p class="vide-message cachee" id="vide">
          Elle n'a pas encore terminé le quiz... patience 💗
        </p>
      </section>

    </main>
  </div>

  <script src="../config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
